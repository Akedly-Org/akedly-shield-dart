name: akedly_shield
description: Client-side PoW solver, Turnstile helper, hosted passkey launcher, and native passkey bridge for Akedly Shield V1.2.
version: 1.2.0
repository: https://github.com/Akedly-Org/akedly-shield-dart

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.3'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.0
  webview_flutter: ^4.0.0
  flutter_web_auth_2: ^4.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.akedly.shield.flutter
        pluginClass: AkedlyShieldPlugin
      ios:
        pluginClass: AkedlyShieldPlugin

dev_dependencies:
  test: ^1.24.0
  flutter_test:
    sdk: flutter
